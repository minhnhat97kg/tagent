# tagent plugin
# Load via the entry point script:
#   run-shell /path/to/tagent.tmux
#
# Customizable options (set BEFORE loading to override):
#   @sidebar_width        - sidebar width in columns, or percentage of window width (default: 15%)
#                           also re-applied automatically after any layout change in the
#                           window (select-layout, resize-pane, split-window...) — see the
#                           window-layout-changed hook below
#   @sidebar_position     - sidebar placement: left or right (default: left)
#   @sidebar_auto_create  - create sidebar automatically for new windows (default: on)
#   @sidebar_auto_create_delay - seconds to defer auto-create after a new window is
#                                created so a declaratively-built window (e.g.
#                                tmuxinator's split-window + select-layout) finishes
#                                first; accepts fractional seconds (default: 0)
#   @sidebar_key          - keybinding to toggle sidebar (default: e)
#   @sidebar_key_all      - keybinding to toggle sidebar in all windows (default: E)
#   @agent_theme          - built-in color palette: "light" (default) or "dark"
#   @agent_color_<name>   - override one theme token, 256-color code or #RRGGBB hex
#                           (token names: internal/sidebar/theme.go, themeColorTokens)
#   @agent_icon_<name>    - override one status icon (token names: themeIconTokens)
#   @agent_scrape         - screen-scrape status for agents without hooks (default: on)
#   @agent_watch_key      - keybinding to expand/collapse the sidebar into the
#                           dashboard — the sidebar pane is zoomed, the window's
#                           layout is untouched (default: A);
#                           `o` inside the sidebar does the same
#   @agent_action_key     - quick action from anywhere: go to the agent that needs
#                           you / send @agent_done_prompt to a finished one (default: a)
#   @agent_avatar         - sidebar avatar: slime | cat | sprout | ghost | robot | off
#                           (default: slime)
#   @agent_avatar_lang    - avatar language: vi | en (default: en)
#   @agent_avatar_lines   - text lines in the avatar's speech bubble, 1–8 (default: 1)
#   @agent_avatar_llm     - command that writes the dashboard's task summaries, prompt
#                           passed as the last argument; off = none
#                           (default: claude -p --model haiku)
#   @agent_done_prompt    - prompt the quick action sends to a finished agent
#                           (default: unset → jump to it instead)
#   @agent_avatar_say_waiting / _say_done / _say_error - your own avatar lines
#                           (override the LLM); {name} and {action} are replaced
#   @agent_digest_llm     - command writing the avatar's line on every agent event,
#                           prompt = last argument
#                           (default: ollama run --nowordwrap --think=false qwen3:0.6b)
#   @agent_stuck_minutes  - warn when a running agent shows no activity this long (default: 10)
#   @agent_notify_url     - also push notifications here (ntfy topic URL or Telegram
#                           sendMessage URL)
#   Every setting can also be changed from the settings screen (`,` in the sidebar,
#   or `tagent config`), which saves it to ~/.config/tagent/config.conf.
#   @agent_max_panes      - max agent panes per "agents" window for `tagent new`;
#                           a full window opens a new one (default: 4)
#
# Status-line rollup (herdr-style), opt-in — add to your own formats:
#   set -ga window-status-format         ' #{E:@agent_status_format}'
#   set -ga window-status-current-format ' #{E:@agent_status_format}'
#   set -ga status-right '#{E:@agent_session_status_format}'
#   set -ga status-right '#{E:@agent_hidden_status_format}'   # background (standalone) agents
# One icon per agent pane that needs a look: waiting, error, running,
# background, done (finished while you weren't looking). Idle panes show
# nothing. Pure tmux formats, no subprocess per redraw.
#
# Internal tmux options used by the plugin:
#   @agent_sidebar_dir    - plugin directory (auto-detected by tagent.tmux)
#   @sidebar_pid          - pane option used to notify running sidebar instances

# --- Plugin location ---
# @agent_sidebar_dir must be set by tagent.tmux before sourcing this file

# --- Sidebar options ---
# Colors/icons are managed in Go (part 6). Users may override @agent_theme
# and any @agent_color_*/@agent_icon_* tmux option in their own config.
# Non-color sidebar options are seeded here only when unset.
if -F '#{==:#{@sidebar_width},}' 'set -g @sidebar_width 15%'
if -F '#{==:#{@sidebar_position},}' 'set -g @sidebar_position left'
if -F '#{==:#{@sidebar_auto_create},}' 'set -g @sidebar_auto_create on'
if -F '#{==:#{@sidebar_auto_create_delay},}' 'set -g @sidebar_auto_create_delay 0'
if -F '#{==:#{@sidebar_pet},}' 'set -g @sidebar_pet off'
if -F '#{==:#{@sidebar_key},}' 'set -g @sidebar_key e'
if -F '#{==:#{@sidebar_key_all},}' 'set -g @sidebar_key_all E'
if -F '#{==:#{@agent_watch_key},}' 'set -g @agent_watch_key A'
if -F '#{==:#{@agent_action_key},}' 'set -g @agent_action_key a'

# --- Keybindings ---
run-shell 'key="$(tmux display-message -p "#{@sidebar_key}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle \"##{window_id}\" \"##{pane_current_path}\""'
run-shell 'key="$(tmux display-message -p "#{@agent_action_key}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell -b "\"$bin\" next >/dev/null"'
run-shell 'key="$(tmux display-message -p "#{@sidebar_key_all}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle-all"'

# --- Hooks (remove our own entries first to prevent duplicates on config reload) ---
run-shell 'tmux show-hooks -g after-new-window | awk "/@agent_sidebar_bin/ && /toggle --create-only/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-pane | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'for h in after-select-pane after-select-window client-session-changed; do tmux show-hooks -g $h | awk "/@pane_unseen/ { print \$1 }" | xargs -rn1 tmux set-hook -gu; done'
run-shell 'tmux show-hooks -g after-select-window | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g pane-exited | awk "/@agent_sidebar_bin/ && /auto-close/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g window-layout-changed | awk "/@pane_role/ && /resize-pane/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'

# --- Auto sidebar on new window (create-only, no toggle) ---
# With @sidebar_auto_create_delay non-zero, defer the create-only split into a
# backgrounded shell that sleeps first. This lets a window built declaratively
# (e.g. tmuxinator's split-window + select-layout sequence) finish before the
# sidebar pane is injected — otherwise the sidebar lands while the window still
# has one pane and the later select-layout is computed with an extra pane,
# scrambling pane sizes and roles. The sync/deferred choice is fixed at load
# time; the duration itself is read at fire time. Switching the delay between
# zero and non-zero needs a config reload to re-pick the hook.
if -F '#{!=:#{@sidebar_auto_create},off}' {
  if -F '#{==:#{@sidebar_auto_create_delay},0}' {
    set-hook -ga after-new-window 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
  } {
    set-hook -ga after-new-window 'run-shell -b "sleep \"#{@sidebar_auto_create_delay}\"; \"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
  }
}

# --- Notify sidebar on pane/window focus change (SIGUSR1 → instant refresh) ---
set-hook -ga after-select-pane "run-shell -b 'tmux list-panes -t \"#{window_id}\" -F \"#{@sidebar_pid}\" 2>/dev/null | while read pid; do [ -n \"\$pid\" ] && kill -USR1 \"\$pid\" 2>/dev/null; done; true'"
set-hook -ga after-select-window "run-shell -b 'tmux list-panes -t \"#{window_id}\" -F \"#{@sidebar_pid}\" 2>/dev/null | while read pid; do [ -n \"\$pid\" ] && kill -USR1 \"\$pid\" 2>/dev/null; done; true'"

# --- Close the window when only the sidebar pane remains ---
set-hook -ga pane-exited 'run-shell "\"#{@agent_sidebar_bin}\" auto-close \"#{window_id}\""'

# --- "Done, not yet seen" (@pane_unseen) clears once the pane is viewed ---
# Set by the Stop hook / scraper only when nobody was looking at the pane
# (tmux.IsPaneViewed). #{pane_id} here is the newly active pane. Wrapped in
# run-shell because tmux does NOT format-expand a -t target: a bare
# `set -t "#{pane_id}"` fails with "no such pane", and that error makes the
# hooked select-pane itself exit 1 (breaking `… || tmux select-pane -L`
# style navigation bindings).
set-hook -ga after-select-pane 'run-shell -b "tmux set -pu -t #{pane_id} @pane_unseen"'
set-hook -ga after-select-window 'run-shell -b "tmux set -pu -t #{pane_id} @pane_unseen"'
set-hook -ga client-session-changed 'run-shell -b "tmux set -pu -t #{pane_id} @pane_unseen"'

# --- Status-line rollup formats (see header for how to use them) ---
# Evaluated per window via #{P:…} (loop over the window's panes). Colors
# follow the dark theme in internal/sidebar/theme.go.
set -g @agent_pane_icon '#{?#{==:#{@pane_status},waiting},#[fg=colour221]#[default] ,#{?#{==:#{@pane_status},error},#[fg=colour167]#[default] ,#{?#{==:#{@pane_status},running},#[fg=colour114]#[default] ,#{?#{==:#{@pane_status},background},#[fg=colour108]#[default] ,#{?#{@pane_unseen},#[fg=colour80]#[default] ,}}}}}'
set -g @agent_status_format '#{P:#{E:@agent_pane_icon}}'
set -g @agent_session_status_format '#{W:#{E:@agent_status_format}}'
# Tabs of the hidden background session that standalone `tagent new`
# creates (no tmux needed): "agent-name icon" per agent pane. Pure format, no #().
set -g @agent_hidden_status_format '#{S:#{?#{@agent_hidden},#{W:#{P:#{?#{@pane_agent},#{?#{@pane_name},#{@pane_name},#{@pane_agent}}#{E:@agent_pane_icon} ,}}},}}'

# --- Screen-scrape fallback for agents without hooks (internal/scrape) ---
# Also refreshes clients' status lines when any agent status changes. A new
# instance replaces the old one (newest pid in @agent_scrape_pid wins), so a
# config reload is safe.
if -F '#{!=:#{@agent_scrape},off}' {
  run-shell -b '"#{@agent_sidebar_bin}" scrape >/dev/null 2>&1'
}
