name: improvement
description: "Small tweak to an existing feature in 1-3 files, no lead: scout (skipped when the ticket names files), build, test"
inputs:
  change: {description: "what to improve and where (feature, file or screen)", required: true}
jobs:
  scout: {uses: scout}
  build:
    needs: scout
    status: improving
    agent: dev
    prompt: |
      Improve: ${{ inputs.change }}
      Start from the scout output in Job outputs; open only the files it names unless it is wrong. Do not re-explore the repo.
      Small, focused change to existing code: reuse what is there, no new abstractions.
      If it turns out to need a redesign or touches many packages, move the ticket to blocked and say so in one line.
      Update help/docs the change affects. Make sure it builds and the touched packages' tests pass. Don't commit.
    max-loops: 2
  test:
    needs: build
    status: testing
    run: ./scripts/check.sh
    on-failure: build
